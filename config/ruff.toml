# Ruff configuration
# See https://docs.astral.sh/ruff/configuration/
line-length = 110
target-version = "py312"
extend-exclude = [
    "_grpc",
]

[lint]
extend-select = [
    "E", "F", "I", "ANN", "W", "T", "COM", "RUF",
    "C4", "SIM", "TC", "RET", "S", "B", "PYI",
    "PTH", "PERF", "FURB",
]
# Removing COM812 which conflict with the formatter
# See https://docs.astral.sh/ruff/rules/missing-trailing-comma/#ruff-format
ignore = [
    "ANN002",  # Missing type args
    "ANN003",  # Missing type kwargs
    "ANN401",  # Dynamically typed expressions (Any)
    "RUF029",  # Unused async
    "RUF052",  # Used dummy variable
    "COM812",
    "SIM108",  # Use ternary operator
    "SIM102",  # Use a single if
    "UP035",   # `typing.Type` is deprecated, use `type` instead
    "UP045",   # Non pep604 'Optional' annotation
    "UP040",   # `TypeAlias` annotation instead of the `type` keyword
    "UP006",   # Use `type` instead of `Type` for type annotation 
               # Necessary because `type` does not allow for introspection while `Type` does.
    "PIE790",  # Unnecessary `pass` statement
    "N999",    # Invalid module name (not snake case)
    "UP017",   # Use `datetime.UTC` alias
    "UP007",   # Use `X | Y` for type annotations
    "UP008",   # Use `super()` instead of `super(__class__, self)` 
               # (false positive for class method ?)
    "DTZ",
    "BLE001",  # Do not catch blind exception: `Exception`
]

[format]
indent-style = "space"
docstring-code-format = true

[lint.isort]
lines-between-types = 1
known-first-party = [
    "qjazz_contrib", 
    "qjazz_cache",
    "qjazz_rpc",
    "qjazz_admin",
    "qjazz_processes",
]
#known-third-party = [
#    "qgis",
#]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "qgis",
    "first-party",
    "local-folder",
]

[lint.isort.sections]
qgis = ["qgis", "processing"]

[lint.flake8-annotations]
ignore-fully-untyped = true
suppress-none-returning = true
suppress-dummy-args = true
