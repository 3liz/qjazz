#
# Docker compose for running required tiers services 
#
# Run processing worker as:
# qjazz-processing serve -C qjazz-processes/tests/config-processing.toml
#
# Run processes server as:
# qjazz-processes serve -C qjazz-processes/tests/config-server.toml
#

services:
  rabbitmq:
    # WARNINC: Celery is not compatible with rabbitmq 4.3+
    image: rabbitmq:4.2-alpine
    ports:
    - 127.0.0.1:5671:5671
    - 127.0.0.1:5672:5672
    - 127.0.0.1:15672:15672

  redis:
    image: redis:8-alpine
    ports:
    - 127.0.0.1:6379:6379

  s3:
    image: rustfs/rusfs
    volumes:
    - { type: volume, source: s3data, target: /var/lib/data }    
    environment:
      RUSTFS_CONSOLE_ENABLE: true
      RUSTFS_ACCESS_KEY: "qjazzadmin"
      RUSTFS_SECRET_KEY: "qjazzadmin"
    ports:
    - 127.0.0.1:9000:9000
    - 127.0.0.1:9001:9001
    profiles:
    - s3

volumes:
  s3data:
    driver: local
