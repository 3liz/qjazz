        type: string
      processId:
        title: Process ID
        type: string
      type:
        const: process
        default: process
        title: Job type
        type: string
      status:
        enum:
        - pending
        - accepted
        - running
        - successful
        - failed
        - dismissed
        title: Status
        type: string
      message:
        title: Message
        type: string
      created:
        format: date-time
        title: Created
        type: string
      started:
        format: date-time
        title: Started
        type: string
      finished:
        format: date-time
        title: Finished
        type: string
      updated:
        format: date-time
        title: Updated
        type: string
      progress:
        maximum: 100
        minimum: 0
        title: Progress
        type: integer
      exception:
        $ref: '#/definitions/JobException'
        title: Exception
      links:
        default: []
        items:
          $ref: '#/definitions/LinkHttp'
        title: Links
        type: array
      runConfig:
        $ref: '#/definitions/JsonValue'
        title: Runconfig
      expiresAt:
        format: date-time
        title: Expiresat
        type: string
      tag:
        title: Tag
        type: string
    required:
    - jobId
    - status
    - created
    title: JobStatus
    type: object
  InputDescription:
    properties:
      title:
        default: ''
        title: Title
        type: string
      description:
        title: Description
        type: string
      keywords:
        default: []
        items:
          type: string
        title: Keywords
        type: array
      metadata:
        default: []
        items:
          anyOf:
          - $ref: '#/definitions/MetadataLink'
          - $ref: '#/definitions/MetadataValue'
        title: Metadata
        type: array
      schema:
        additionalProperties:
          $ref: '#/definitions/JsonValue'
        title: Schema
        type: object
      valuePassing:
        default:
        - byValue
        items:
          enum:
          - byValue
          - byReference
          type: string
        title: Valuepassing
        type: array
      minOccurs:
        default: 1
        minimum: 0
        title: Minoccurs
        type: integer
      maxOccurs:
        anyOf:
        - exclusiveMinimum: 0
          type: integer
        - const: unbounded
          type: string
        default: 1
        title: Maxoccurs
    required:
    - schema
    title: InputDescription
    type: object
  MetadataLink:
    properties:
      rel:
        title: Rel
        type: string
      mimeType:
        title: Mimetype
        type: string
      title:
        default: ''
        title: Title
        type: string
      description:
        title: Description
        type: string
      length:
        title: Length
        type: integer
      templated:
        default: false
        title: Templated
        type: boolean
      hreflang:
        title: Hreflang
        type: string
      href:
        format: uri-reference
        title: Href
        type: string
      role:
        title: Role
        type: string
    required:
    - href
    title: MetadataLink
    type: object
  MetadataValue:
    properties:
      role:
