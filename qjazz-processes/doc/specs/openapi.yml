      qgisVersionInfo:
        title: Qgisversioninfo
        type: integer
      versionDetails:
        anyOf:
        - type: string
        - items:
            type: string
          type: array
        title: Versiondetails
      callbacks:
        items:
          type: string
        title: Callbacks
        type: array
      links:
        items:
          $ref: '#/definitions/LinkHttp'
        title: Links
