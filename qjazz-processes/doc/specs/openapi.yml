        type: string
      title:
        default: ''
        title: Title
        type: string
      description:
        title: Description
        type: string
      length:
        title: Length
        type: integer
      templated:
        default: false
        title: Templated
        type: boolean
      hreflang:
        title: Hreflang
        type: string
      href:
        format: uri-reference
        title: Href
        type: string
      displaySize:
        title: Displaysize
        type: string
    required:
    - href
    - displaySize
    title: FileLink
    type: object
  FilesResponse:
    properties:
      files:
        items:
          $ref: '#/definitions/FileLink'
        title: Files
        type: array
      links:
        items:
          $ref: '#/definitions/LinkHttp'
        title: Links
        type: array
    required:
    - files
    - links
    title: FilesResponse
    type: object
  DirResource:
    additionalProperties: true
    properties:
      name:
        title: Resource name
        type: string
      isDir:
        const: true
        default: true
        title: Isdir
        type: boolean
    required:
    - name
    title: DirResource
    type: object
  FileResource:
    additionalProperties: true
    properties:
      name:
        title: Resource name
        type: string
      size:
        title: Size in bytes
        type: integer
      contentType:
        title: Contenttype
        type: string
      lastModified:
        format: date-time
        title: Lastmodified
        type: string
      encrypted:
        title: Encrypted
        type: boolean
      version:
        title: Version
        type: string
      isDir:
        const: false
        default: false
        title: Isdir
        type: boolean
    required:
    - name
    - encrypted
    title: FileResource
    type: object
  ResourceType:
    anyOf:
    - $ref: '#/definitions/DirResource'
    - $ref: '#/definitions/FileResource'
  ResourceList:
    properties:
      resources:
        items:
          anyOf:
          - $ref: '#/definitions/DirResource'
          - $ref: '#/definitions/FileResource'
        title: Resources
        type: array
      links:
        default: []
        items:
          $ref: '#/definitions/LinkHttp'
        title: Links
        type: array
    required:
    - resources
    title: ResourceList
    type: object
