    required:
    - value
    title: MetadataValue
    type: object
  OutputDescription:
    properties:
      title:
        default: ''
        title: Title
        type: string
      description:
        title: Description
        type: string
      keywords:
        default: []
        items:
          type: string
        title: Keywords
        type: array
      metadata:
        default: []
        items:
          anyOf:
          - $ref: '#/definitions/MetadataLink'
