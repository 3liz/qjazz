openapi: 3.0.0
paths:
  /:
    get:
      summary: Landing page
      description: "Landing page for Qjazz processes api\n"
      tags:
      - api
      responses:
        '200':
          description: "Returns the Landing page data as JSon\n"
          content:
            application/json:
              schema:
                $ref: '#/definitions/LandingPageModel'
  /conformance:
    get:
      summary: Conformances classes
      description: "The list of conformance classes\n"
      tags:
      - api
      responses:
        '200':
          description: "Returns the list of conformance classes\n"
          content:
            application/json:
              schema:
                $ref: '#/definitions/Conformance'
  /processes/:
    get:
      summary: Get available processes
      description: "Returns the list of available processes\n"
      parameters:
      - in: query
        name: service
        schema:
          type: string
        required: false
        description: "The service requested.\nNote this is the default behavior for\n\
          targeting a service: the server may\ndefine its own policy for handling
          accesses\nto services.\n"
      tags:
      - processes
      responses:
        '200':
          description: "Returns the list of process summaries\n"
          content:
            application/json:
              schema:
                $ref: '#/definitions/ProcessList'
  /processes/{Ident}:
    get:
      summary: Get process description
      description: "Return the process description for\nthe given service and  process
        identifier\n"
      parameters:
      - in: path
        name: Ident
        schema:
          type: string
        required: true
        description: process identifier
      - in: query
        name: service
        schema:
          type: string
        required: false
        description: "The service requested.\nNote this is the default behavior for\n\
          targeting a service: the server may\ndefine its own policy for handling
          accesses\nto services.\n"
      - in: query
        name: project
        schema:
          type: string
        required: false
        description: "The project path.\nNote this is the default behavior for\ntargeting
          a project: the server may\ndefine its own policy for handling accesses\n\
          to projects.\n"
      tags:
      - processes
      responses:
        '200':
          description: "Returns the process description\n"
          content:
            application/json:
              schema:
                $ref: '#/definitions/ProcessDescription'
  /processes/{Ident}/execution:
    post:
      summary: Execute process
      description: "Execute the process and returns the job status\n"
      parameters:
      - in: path
        name: Ident
        schema:
          type: string
        required: true
        description: Process identifier
      - in: query
        name: tag
        schema:
          type: string
          maxLength: 36
        required: false
        description: job tag
      - in: query
        name: service
        schema:
          type: string
        required: false
        description: "The service requested.\nNote this is the default behavior for\n\
          targeting a service: the server may\ndefine its own policy for handling
          accesses\nto services.\n"
      - in: query
        name: project
        schema:
          type: string
        required: false
        description: "The project path.\nNote this is the default behavior for\ntargeting
          a project: the server may\ndefine its own policy for handling accesses\n\
          to projects.\n"
      tags:
      - processes
      requestBody:
        required: true
        description: "An execution request specifying any inputs for the process to
          execute,\nand optionally to select specific outputs."
        content:
          application/json:
            schema:
              $ref: '#/definitions/JobExecute'
      responses:
        '200':
          description: "Process executed succesfully. Only returned in case of synchronous
            execution.\n"
          content:
            application/json:
              schema:
                $ref: '#/definitions/JobResults'
        '202':
          description: "Process accepted. Returned in case of asynchronous execution.\n"
          content:
            application/json:
              schema:
                $ref: '#/definitions/JobStatus'
  /jobs/:
    get:
      summary: Get Job list
      description: "Returns the list job's status\n"
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 10
        required: false
        description: Number of element returned
      - in: query
        name: page
        schema:
          type: integer
          minimum: 0
          default: 0
        required: false
        description: Start page index
      - in: query
        name: status
        required: false
        schema:
          type: array
          items:
            type: string
          description: Filter by status
      - in: query
        name: processID
        required: false
        schema:
          type: array
          items:
            type: string
        description: Filter by process
      - in: query
        name: tag
        required: false
        schema:
          type: array
          items:
            type: string
        description: Filter by tag
      - in: query
        name: service
        required: false
        schema:
          type: string
        description: Filter by service
      tags:
      - jobs
      responses:
        '200':
          description: "Job status list\n"
          content:
            application/json:
              schema:
                $ref: '#/definitions/JobList'
        '404':
          description: Jobs not found
          content:
            application/json:
              schema:
                $ref: '#/definitions/ErrorResponse'
  /jobs/{JobId}:
    get:
      summary: Get Job status
      description: "Returns the job status\n"
      parameters:
      - in: path
        name: JobId
        schema:
          type: string
        required: true
        description: Job id
      - in: query
        name: details
        schema:
          type: boolean
        required: false
        description: Job extended details
      tags:
      - jobs
      responses:
        '200':
          description: "Job status\n"
          content:
            application/json:
              schema:
                $ref: '#/definitions/JobStatus'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/definitions/ErrorResponse'
    delete:
      summary: cancel a job execution, remove a finished job
      description: "Cancel a job execution and remove it from the jobs list.\n"
      parameters:
      - in: path
        name: JobId
        schema:
          type: string
        required: true
        description: Job id
      tags:
      - jobs
      responses:
        '200':
          description: "Job status\n"
          content:
            application/json:
              schema:
                $ref: '#/definitions/JobStatus'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/definitions/ErrorResponse'
  /jobs/{JobId}/results:
    get:
      summary: retrieve the result(s) of a job
      description: "List available results\n"
      parameters:
      - in: path
        name: JobId
        schema:
          type: string
        required: true
        description: Job id
      tags:
      - jobs
      responses:
        '200':
          description: "Job status\n"
          content:
            application/json:
              schema:
                $ref: '#/definitions/JobResults'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/definitions/ErrorResponse'
  /jobs/{JobId}/log:
    get:
      summary: Get Job process execution log
      description: "Returns the job processe execution log\n"
      parameters:
      - in: path
        name: JobId
        schema:
          type: string
        required: true
        description: Job id
      tags:
      - jobs
      responses:
        '200':
          description: "Job log\n"
          content:
            application/json:
              schema:
                $ref: '#/definitions/LogResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/definitions/ErrorResponse'
  /jobs/{JobId}/files/:
    get:
      summary: Get Job process execution files
      description: "Returns the job processe execution files\n"
      parameters:
      - in: path
        name: JobId
        schema:
          type: string
        required: true
        description: Job id
      tags:
      - jobs
      responses:
        '200':
          description: "Job log\n"
          content:
            application/json:
              schema:
                $ref: '#/definitions/FilesResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/definitions/ErrorResponse'
  /jobs/{JobId}/files/{Resource}:
    head:
      summary: Get Job process execution files
      description: "Returns the job processe execution files\n"
      parameters:
      - in: path
        name: JobId
        schema:
          type: string
        required: true
        description: Job id
      - in: path
        name: Resource
        schema:
          type: string
        required: true
        description: Resource path
      tags:
      - jobs
      responses:
        '200':
          description: "Job log\n"
          content:
            application/json:
              schema:
                $ref: '#/definitions/FilesResponse'
        '404':
          description: Job or resource not found
          content:
            application/json:
              schema:
                $ref: '#/definitions/ErrorResponse'
    get:
      summary: Get Job process execution files
      description: "Returns the job processe execution files\n"
      parameters:
      - in: path
        name: JobId
        schema:
          type: string
        required: true
        description: Job id
      - in: path
        name: Resource
        schema:
          type: string
        required: true
        description: Resource path
      tags:
      - jobs
      responses:
        '200':
          description: "Job log\n"
          content:
            application/json:
              schema:
                $ref: '#/definitions/FilesResponse'
        '404':
          description: Job or resource not found
          content:
            application/json:
              schema:
                $ref: '#/definitions/ErrorResponse'
  /services/:
    get:
      summary: Return availables services
      description: "Returns a list of available services.\n"
      tags:
      - services
      responses:
        '200':
          description: "Returns the list of available services\n"
          content:
            application/json:
              schema:
                $ref: '#/definitions/ServicesResponse'
definitions:
  JsonValue: {}
  ErrorResponse:
    properties:
      message:
        title: Message
