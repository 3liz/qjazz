        title: Metadata
        type: array
      schema:
        additionalProperties:
          $ref: '#/definitions/JsonValue'
        title: Schema
        type: object
      valuePassing:
        default:
        - byValue
        items:
          enum:
          - byValue
          - byReference
          type: string
        title: Valuepassing
        type: array
    required:
    - schema
    title: OutputDescription
    type: object
  ProcessDescription:
    properties:
      title:
        default: ''
        title: Title
        type: string
      description:
        title: Description
        type: string
      keywords:
        default: []
        items:
          type: string
        title: Keywords
        type: array
      metadata:
        default: []
