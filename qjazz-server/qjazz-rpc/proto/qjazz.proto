/*
    https://protobuf.dev/programming-guides/proto3/ 
*/
syntax = "proto3";

package qjazz;


service QgisServer {
    rpc Ping (PingRequest) returns (PingReply) {}
    rpc ExecuteOwsRequest (OwsRequest) returns (stream ResponseChunk) {}
    rpc ExecuteApiRequest (ApiRequest) returns (stream ResponseChunk) {}
    rpc Collections (CollectionsRequest) returns (CollectionsPage) {}
}

service QgisAdmin {
    rpc Ping (PingRequest) returns (PingReply) {}
    rpc CheckoutProject (CheckoutRequest) returns (CacheInfo) {}
    rpc DropProject (DropRequest) returns (CacheInfo) {}
    rpc ListCache (Empty) returns (stream CacheInfo) {}
    rpc ClearCache (Empty) returns (Empty) {}
    rpc UpdateCache (Empty) returns (Empty) {}
    rpc ListPlugins (Empty) returns (stream PluginInfo) {}
    rpc SetConfig (JsonConfig) returns (Empty) {}
    rpc GetConfig (Empty) returns (JsonConfig) {}
    rpc GetProjectInfo (ProjectRequest) returns (ProjectInfo) {}
    rpc Catalog (CatalogRequest) returns (stream CatalogItem) {}
    rpc GetEnv (Empty) returns (JsonConfig) {}
    rpc SetServerServingStatus (ServerStatus) returns (Empty) {}
    rpc Stats (Empty) returns (StatsReply) {}
    rpc Sleep (SleepRequest) returns (Empty) {}
    rpc Reload (Empty) returns (Empty) {}
    rpc DumpCache (Empty) returns (stream DumpCacheItem) {}
}


message PingRequest {
    string echo = 1;
}


message PingReply {
    string echo = 1;
}


message Empty {}


message SleepRequest {
    int64 delay = 1;
}


enum ServingStatus {
    SERVING = 0;
    NOT_SERVING = 1;
}


message StatsReply {
    // Number of workers currently processing a request
    uint64 active_workers = 1;
    // Number of workers available in the queue
    uint64 idle_workers = 2;
    // Worker activity as `active / (active + idle)`, 0 if there are no workers
    double activity = 3;
    // Ratio of failed workers over the maximum number of workers
    double failure_pressure = 4;
    // Ratio of waiting requests over the maximum number of waiting requests
    double request_pressure = 5;
    // Server uptime in seconds
    uint64 uptime = 6;
    // Number of requests waiting for a worker
    uint64 waiting_requests = 7;
    // Cumulative wait time for a worker (counters since server start).
    // The mean wait time over an interval is computed from two samples as
    // delta(wait_time_total_us) / delta(wait_count).
    uint64 wait_count = 8;
    uint64 wait_time_total_us = 9;
    // Longest wait time since server start
    uint64 wait_time_max_us = 10;
    // Nominal number of workers (adjusted by adaptive scaling)
    uint64 num_processes = 11;
}


message ServerStatus {
    ServingStatus status = 1;
}


message ResponseChunk {
    bytes chunk = 1;
}

message OwsRequest {
    string service = 1;
    string request = 2;
    string target = 3;
    optional string version = 4;
    optional string url = 5;
    bool direct = 6;
    optional string options = 7;
    optional string request_id = 8;
    optional string content_type = 9;
    optional string method = 10;
    optional bytes body = 11;
}

message ApiRequest {
    string name = 1;
    string path = 2;
    string method = 3;
    optional bytes data = 4;
    bool delegate = 5;
    optional string target = 6;
    optional string url = 7;
    bool direct = 8;
    optional string options = 9;
    optional string request_id = 10;
    optional string content_type = 11;
}

// Collections

message CollectionsRequest {
    optional string location = 1;
    optional string resource =2;
    int64 start = 3;
    int64 end = 4;
}

message CollectionsPage {
    message CollectionsItem {
        string name = 2;
        string json = 3;
        // Bitflags
        // MAP = 0x01
        // FEATURES = 0x02
        // COVERAGE = 0x04
        // TILE = 0x08
        // STYLE = 0x10
        int64 endpoints = 4;
    }
    string schema = 1;
    bool next = 2;
    repeated CollectionsItem items = 3;    
}


/*
    Admin service
*/


message CheckoutRequest {
    string uri = 1;
    optional bool pull = 2;
}

message CacheInfo {
    string uri = 1;
    int64 status = 2;
    bool in_cache = 3;
    optional int64 timestamp = 4;
    optional string name = 5;
    optional string storage = 6;
    optional string last_modified = 7;
    optional string saved_version = 8;
    map<string,int64> debug_metadata = 9;
    string cache_id = 10;
    int64 last_hit = 11;
    int64 hits = 12;
    bool pinned = 13;
}

message DropRequest {
    string uri = 1;
}

message ProjectRequest {        
    string uri = 1;
}

message ProjectInfo {
    message Layer {
        string layer_id = 1;
        string name = 2;
        string source = 3;
        string provider = 7;
        string layer_type = 8;
        string crs = 4;
        bool is_valid = 5;
        bool is_spatial = 6;
    } 
    int64 status = 1;
    string uri = 2;
    string filename = 3;
    string crs = 4;
    string last_modified = 5;
    string storage = 6;
    bool has_bad_layers = 7;
    repeated Layer layers = 8;
    string cache_id = 9;
}

message PluginInfo {
    string name = 1;
    string path = 2;
    string plugin_type = 3;
    string metadata = 4;
}

message JsonConfig {
    string json = 1;
}

message CatalogRequest {
    optional string location = 1;
}

message CatalogItem {
    string uri = 1;
    string name = 2;
    string storage = 3;
    string last_modified = 4;
    string public_uri = 5;
}

message DumpCacheItem {
    string cache_id = 1;
    string config = 2;
    repeated CacheInfo cache = 3;
}

